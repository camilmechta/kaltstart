name: contacts

on:
  schedule:
    # Every night, one hour after the ingestion's sync: read the company
    # sites that are due and store their contacts.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: Contacts command to run
        type: choice
        options:
          - run
          - status
        default: run
      args:
        # This repository is public and so are these logs and inputs: never
        # type a person's name or an email address here. Removal on request
        # is done in the Supabase SQL editor (see the README).
        description: Extra arguments, e.g. --max 20 --country Germany (never a name or an address); empty means every open country
        type: string
        default: ""

permissions:
  contents: read

# One run at a time: two runs would read the same sites twice.
concurrency:
  group: contacts
  cancel-in-progress: false

jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run contacts
        env:
          COMMAND: ${{ github.event.inputs.command || 'run' }}
          # The countries the scraper has been measured on (decisions D61, D65, D68).
          ARGS: ${{ github.event.inputs.args || '--country Switzerland --country Germany --country Austria' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # $ARGS is unquoted on purpose: the shell splits it into words.
        run: python -m kaltstart.contacts "$COMMAND" $ARGS
