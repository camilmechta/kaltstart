name: sql

# Runs the real migrations and their functions on a throwaway local
# PostgreSQL with invented data (tests/sql, D87). Never the production
# database: no secret is used here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,sql]"
      - run: pytest -q tests/sql
