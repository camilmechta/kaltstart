name: sql

# Runs the real migrations and their functions on a throwaway local
# PostgreSQL with invented data (tests/sql, D87). Never the production
# database: no secret is used here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,sql]"
      - run: pytest -q tests/sql
