name: security

# Checks the pinned libraries of the web app against the public list of known
# vulnerabilities. A separate workflow: a finding shows here as a red cross
# and never blocks the tests, the nightly ingestion or the contact run.
on:
  push:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --disable-pip --no-deps
