name: security

# Checks the pinned libraries of the web app against the public list of known
# vulnerabilities. A separate workflow: a finding shows here as a red cross
# and never blocks the tests, the nightly ingestion or the contact run.
on:
  push:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --disable-pip --no-deps
