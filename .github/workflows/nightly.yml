name: nightly

on:
  schedule:
    # Every night: incremental sync through /changes.
    - cron: "17 2 * * *"
    # Every Sunday: re-read the last 12 months, because /changes does not
    # report edits to rounds that already exist (for example a late amount).
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: Ingestion command to run
        type: choice
        options:
          - sync
          - backfill
          - reclean
          - report
          - cities
          - sample
        default: sync
      args:
        description: Extra arguments for the command
        type: string
        default: ""

permissions:
  contents: read

# One run at a time, to stay under the Tech.eu quotas. GitHub keeps a single
# pending run per group: if two more arrive while one is running, the older
# pending one is cancelled. Cron times are UTC and can start late.
concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run ingestion
        env:
          COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '17 4 * * 0' && 'backfill') || 'sync' }}
          ARGS: ${{ github.event.inputs.args }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # $ARGS is unquoted on purpose: the shell splits it into words.
        run: python -m kaltstart.ingestion "$COMMAND" $ARGS
