# Dependabot opens a pull request when a pinned library or a GitHub action has
# a new version, security fixes first. Nothing is merged without the owner;
# the tests run on each pull request before it is merged.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
