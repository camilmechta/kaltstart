[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaltstart"
version = "0.1.0"
description = "Ingests startup funding rounds from the Tech.eu Funding Explorer API into Supabase."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "supabase>=2.34,<3",
    "beautifulsoup4>=4.12,<5",
    "jinja2>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kaltstart.ingestion" = ["*.csv"]
"kaltstart.mailgen" = ["templates/*.j2"]
"kaltstart.api" = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
